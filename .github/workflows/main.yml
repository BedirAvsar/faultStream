# ==============================================================
# FAULTSTREAM - CI/CD
# ==============================================================
# CI NEDIR?
# Bizim yazdığımız kodun otomatik olarak derlenip test edilmesidir
# CD NEDIR?
# CI adımından başarı ile geçen kodun otomatik olarak sunuculara gönderilmesidir
# ==============================================================

name: FaultStream CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: 3. Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: faultstream-dashboard/package-lock.json

      - name: 4. Backend testleri
        run: ./mvnw --batch-mode clean verify

      - name: 5. Frontend bagimliliklarini yukle
        working-directory: faultstream-dashboard
        run: npm ci

      - name: 6. Frontend lint
        working-directory: faultstream-dashboard
        run: npm run lint

      - name: 7. Frontend build
        working-directory: faultstream-dashboard
        run: npm run build
